name: APK Android

# Compila la app como APK (Capacitor) y la publica en el Release "apk-latest".
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#08090c' --splashBackgroundColor '#08090c'
          # Cada compilación sube el número de versión para que el teléfono la acepte como actualización.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar y verificar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "build-tools: $BT"
          find android/app/build/outputs/apk -name '*.apk' -print
          SIN_FIRMA=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          "$BT/zipalign" -f -p 4 "$SIN_FIRMA" alineado.apk
          "$BT/apksigner" sign \
            --ks android-firma/mientreno.keystore \
            --ks-key-alias mientreno \
            --ks-pass pass:mientreno \
            --key-pass pass:mientreno \
            --out MiEntreno.apk alineado.apk
          # Si la firma no es válida, la compilación falla y no se publica nada.
          "$BT/apksigner" verify --verbose --print-certs MiEntreno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiEntreno-apk
          path: MiEntreno.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MiEntreno.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mi Entreno (APK v1.0.${{ github.run_number }})" \
            --notes "APK de Android generado automáticamente desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Descarga MiEntreno.apk desde tu teléfono e instálalo."
